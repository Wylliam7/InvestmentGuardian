# Profils d'investisseurs fictifs.
# Source : Datathon - Case Officiel 2026 FR.pdf, pages 4 à 7 (persona Robert, p. 7).
# Les champs "heuristic_*" sont des choix de conception du prototype, pas des données officielles.
version: "0.1-v0"
profiles:
  robert:
    display_name: "Robert"
    age: 59
    occupation: "Professionnel de la santé"
    experience: "Avancée"
    risk_profile_label: "Faible à modéré"
    horizon_years_min: 3
    horizon_years_max: 5
    objective: "Préserver son capital tout en maintenant un potentiel de croissance."
    preferences:
      - "Préfère les entreprises établies et les placements dont il comprend bien le modèle d'affaires."
      - "Accorde de l'importance à la stabilité et à la qualité des entreprises."
      - "Peu intéressé par les cryptoactifs."
      - "Suit activement les marchés et s'intéresse aux nouvelles occasions d'investissement."
      - "Peut être tenté par une entreprise très médiatisée, même si elle est plus risquée que ce qu'il recherche habituellement."
    persona_test: "Le système sait-il remettre en question une demande incohérente avec le profil ?"
    source: "Datathon - Case Officiel 2026 FR.pdf, p. 7"
    show_sector_context: false
  amira:
    display_name: "Amira"
    age: 26
    occupation: "Ingénieure logicielle"
    experience: "Intermédiaire"
    risk_profile_label: "Élevé"
    horizon_years_min: 15
    horizon_years_max: null          # « 15 ans ou plus »
    objective: "Faire croître son capital à long terme."
    preferences:
      - "Très intéressée par l'intelligence artificielle et les technologies émergentes."
      - "Ouverte aux entreprises en forte croissance et à une volatilité importante."
      - "Intéressée par les cryptoactifs."
      - "Souhaite maintenir une certaine diversification et éviter de miser exclusivement sur les technologies."
    persona_test: "Jusqu'où le système accepte-t-il le risque ? « Risque élevé » ne signifie pas « tout est acceptable »."
    source: "Datathon - Case Officiel 2026 FR.pdf, p. 5"
    # Contrainte qualitative officielle : affichée à titre d'information (R10), sans seuil en V1.
    show_sector_context: true
  mateo:
    display_name: "Mateo"
    age: 41
    occupation: "Gestionnaire des opérations"
    situation: "En couple, père de deux enfants."
    experience: "Intermédiaire"
    risk_profile_label: "Modéré"
    horizon_years_min: 8
    horizon_years_max: 12
    objective: "Faire croître son capital de façon équilibrée à moyen et à long terme."
    preferences:
      - "Accorde une grande importance aux facteurs ESG."
      - "Souhaite éviter les entreprises liées à des controverses environnementales ou sociales importantes."
      - "Recherche un équilibre entre potentiel de croissance et stabilité."
      - "Ouvert aux technologies émergentes si elles correspondent à son profil de risque."
      - "Peu intéressé par les placements hautement spéculatifs."
    persona_test: "Le système sait-il intégrer autre chose que le rendement et le risque ?"
    source: "Datathon - Case Officiel 2026 FR.pdf, p. 6"
    show_sector_context: false
    # Préférences ESG déclarées (formulations officielles). Le module ESG ne vérifie QUE ce qui est écrit ici.
    esg_preferences:
      importance: "Accorde une grande importance aux facteurs ESG."
      criteria:
        - id: avoid_significant_controversies
          official_wording: "Souhaite éviter les entreprises liées à des controverses environnementales ou sociales importantes."
          direct_dimensions: ["E", "S"]       # environnemental, social : correspondent à la formulation officielle
          indirect_dimensions: ["G"]          # gouvernance : relève de l'intérêt général pour l'ESG, pas de la formulation stricte

