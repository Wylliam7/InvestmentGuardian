# Portefeuilles fictifs prédéfinis (poids entiers en pourcentage ; chaque total = 100 exactement).
# Simulations éducatives, pas des recommandations d'investissement.
#
# Méthode : poids définis d'après l'intention du scénario (voir DECISIONS.md, section « V1 »)
# AVANT de consulter les résultats du Guardian Check ; ils n'ont pas été ajustés pour obtenir un diagnostic.
# `profile_id` est le profil suggéré pour la démonstration ; l'utilisateur peut évaluer n'importe quel portefeuille
# pour n'importe quel profil.
# Scénarios proposés par défaut lorsqu'on sélectionne un profil (A = scénario de risque à examiner, B = alternative diversifiée).
# Ce sont des suggestions : n'importe quelle allocation peut être évaluée pour n'importe quel profil.
profile_defaults:
  robert: {a: robert_nvda_40, b: robert_prudent}
  amira: {a: amira_tech_crypto, b: amira_croissance}
  mateo: {a: mateo_croissance_equilibree, b: mateo_actions_canadiennes}

presets:
  robert_prudent:
    label: "Robert — Prudent et diversifié"
    profile_id: robert
    description: >
      Préservation du capital avec potentiel de croissance : obligations (35 %), actions canadiennes et américaines
      d'entreprises établies, FNB larges et or. Aucune cryptomonnaie.
    weights_pct:
      XBB.TO: 15
      ZST.TO: 10
      AGG: 10
      XIU.TO: 15
      SPY: 10
      RY.TO: 5
      JNJ: 5
      PG: 5
      FTS.TO: 5
      CNR.TO: 5
      ENB.TO: 5
      GLD: 10
  robert_nvda_40:
    label: "Robert — Tentation Nvidia"
    profile_id: robert
    description: >
      Scénario de V0 : une entreprise très médiatisée et volatile à 40 %, complétée par un FNB obligataire et un FNB
      d'actions canadiennes.
    weights_pct:
      NVDA: 40
      XBB.TO: 35
      XIU.TO: 25
  amira_croissance:
    label: "Amira — Croissance diversifiée"
    profile_id: amira
    description: >
      Croissance à long terme avec exposition technologique (QQQ, NVDA, SHOP.TO) mais aussi financières, santé,
      énergie, FNB larges, obligations et une petite part de Bitcoin.
    weights_pct:
      QQQ: 20
      SPY: 20
      XIU.TO: 15
      NVDA: 10
      SHOP.TO: 5
      BTC-USD: 5
      XBB.TO: 10
      RY.TO: 5
      JNJ: 5
      XOM: 5
  amira_tech_crypto:
    label: "Amira — Concentration technologie et crypto"
    profile_id: amira
    description: >
      Cas pédagogique : forte part de technologie et de cryptoactifs (NVDA, TSLA, QQQ, SHOP.TO, Bitcoin, Ether),
      sans obligations. Sert à analyser les risques de concentration malgré une tolérance élevée.
    weights_pct:
      NVDA: 25
      TSLA: 15
      QQQ: 25
      SHOP.TO: 5
      BTC-USD: 20
      ETH-USD: 10
  # --- V3 : Mateo. Compositions choisies pour leur INTENTION FINANCIÈRE (croissance équilibrée, peu de spéculation, ouverture mesurée à la
  # technologie), pas pour obtenir un diagnostic ESG : aucune entreprise n'a été choisie parce qu'elle serait « verte » ou « controversée ».
  mateo_croissance_equilibree:
    label: "Mateo — Croissance équilibrée, ESG à vérifier"
    profile_id: mateo
    description: >
      Croissance équilibrée à moyen et long terme : FNB larges d'actions canadiennes et américaines, un FNB à tendance technologique
      (QQQ, ouverture aux technologies émergentes), obligations (30 %), trois grandes entreprises établies et un peu d'or.
      Aucune cryptomonnaie. Le respect des préférences ESG de Mateo n'est pas établi : voir « Mes préférences ESG ».
    weights_pct:
      XIU.TO: 20
      SPY: 20
      QQQ: 10
      XBB.TO: 20
      AGG: 10
      MSFT: 5
      JNJ: 5
      PG: 5
      GLD: 5
  mateo_actions_canadiennes:
    label: "Mateo — Grandes entreprises canadiennes, ESG à vérifier"
    profile_id: mateo
    description: >
      Scénario de comparaison : de grandes entreprises canadiennes (banques, énergie, transport, services publics) et un FNB obligataire,
      sans actions américaines ni FNB larges. La composition est concentrée sur un seul marché et quelques secteurs, ce que le Guardian Check
      ne mesure pas directement ; par position, le portefeuille est comparable au premier scénario. Le respect des préférences ESG de Mateo
      n'est pas établi : voir « Mes préférences ESG ».
    weights_pct:
      RY.TO: 20
      TD.TO: 15
      ENB.TO: 15
      CNQ.TO: 15
      CNR.TO: 10
      FTS.TO: 10
      XBB.TO: 15
